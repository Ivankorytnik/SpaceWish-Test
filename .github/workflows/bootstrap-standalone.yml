name: Bootstrap standalone SpaceWish Test

on:
  push:
    paths:
      - '.github/workflows/bootstrap-standalone.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Copy pinned test snapshot and make paths local
        shell: bash
        run: |
          set -euo pipefail
          SRC="https://raw.githubusercontent.com/Ivankorytnik/Jelanie/f93e3afa82fbafc82dea9a59484cca85ad039d7e"

          curl -fsSL "$SRC/index.html" -o base.html
          curl -fsSL "$SRC/test/index.html" -o index.html
          curl -fsSL "$SRC/style.css" -o style.css
          curl -fsSL "$SRC/style-base.css" -o style-base.css
          curl -fsSL "$SRC/script-base.js" -o script-base.js
          curl -fsSL "$SRC/favicon-test.svg" -o favicon-test.svg
          curl -fsSL "$SRC/favicon.svg" -o favicon.svg

          mkdir -p assets
          for file in certificate.webp eeg-wish.webp rt64.webp signal-path.webp test-cta.webp test-formats.webp test-mission.webp test-registry.webp test-scenarios.webp; do
            curl -fsSL "$SRC/assets/$file" -o "assets/$file"
          done

          touch .nojekyll

          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace("fetch('../index.html?test-source=' + Date.now()", "fetch('./base.html?test-source=' + Date.now()")
          s = s.replace("css.href = '../style.css';", "css.href = 'style.css';")
          s = s.replace("s.setAttribute('src', '../script.js');", "s.setAttribute('src', 'script-base.js');")
          s = s.replace("icon.href = '../favicon-test.svg';", "icon.href = 'favicon-test.svg';")
          s = s.replace('../assets/', 'assets/')
          s = s.replace('spacewish.agency/test/', 'SpaceWish-Test')
          index.write_text(s, encoding='utf-8')

          script = Path('script-base.js')
          js = script.read_text(encoding='utf-8')
          js = js.replace("favicon.href = window.location.pathname.includes('/test/') ? '../favicon-test.svg' : 'favicon.svg';", "favicon.href = 'favicon-test.svg';")
          script.write_text(js, encoding='utf-8')
          PY

          cat > README.md <<'EOF'
          # SpaceWish Test

          Полностью автономный тестовый стенд проекта «Желание сквозь Вселенную».

          TEST отделён от PROD: HTML, CSS, JavaScript, favicon и изображения хранятся в этом репозитории. Репозиторий не загружает файлы из `Ivankorytnik/Jelanie` и не зависит от `spacewish.agency`.
          EOF

          rm -f .github/workflows/bootstrap-standalone.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit standalone snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make SpaceWish Test fully standalone"
          git push
