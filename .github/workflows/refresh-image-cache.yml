name: Refresh SpaceWish Test image cache

on:
  push:
    paths:
      - '.github/workflows/refresh-image-cache.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add cache-busting versions to images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = '20260909-photos2'

          # Force a fresh CSS request from the test wrapper.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = re.sub(r"css\.href = 'style\.css(?:\?v=[^']*)?';", f"css.href = 'style.css?v={version}';", text)

          # Force fresh requests for all dynamically inserted test images.
          for name in ['test-scenarios.webp','test-formats.webp','test-mission.webp','test-registry.webp','test-cta.webp']:
              text = re.sub(rf"assets/{re.escape(name)}(?:\?v=[^'\" ]*)?", f"assets/{name}?v={version}", text)
          p.write_text(text, encoding='utf-8')

          # Force fresh requests for CSS background images.
          p = Path('style.css')
          css = p.read_text(encoding='utf-8')
          for name in ['rt64.webp','signal-path.webp','eeg-wish.webp','certificate.webp']:
              css = re.sub(rf"\./assets/{re.escape(name)}(?:\?v=[^'\") ]*)?", f"./assets/{name}?v={version}", css)
          p.write_text(css, encoding='utf-8')

          # Also version the stylesheet in the local base snapshot.
          p = Path('base.html')
          base = p.read_text(encoding='utf-8')
          base = re.sub(r'href="style\.css(?:\?v=[^"]*)?"', f'href="style.css?v={version}"', base, count=1)
          p.write_text(base, encoding='utf-8')
          PY

          rm -f .github/workflows/refresh-image-cache.yml

      - name: Commit cache refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spacewish-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refresh updated SpaceWish Test images"
          git push
